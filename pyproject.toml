[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plakar-search"
version = "0.2.0"
description = "Recherche sémantique par contexte dans un store Plakar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Jobierre" },
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "sentence-transformers>=3.0",
    "transformers>=4.50",
    "torch>=2.6",
    "accelerate",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=11",
    "python-magic>=0.4",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
plakar-search = "plakar_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
